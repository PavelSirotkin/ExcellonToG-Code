[pytest]
# Конфигурация pytest для ExcellonToG-Code

# Минимальная версия pytest
minversion = 7.0

# Пути для поиска тестов
testpaths = tests

# Паттерны для поиска тестовых файлов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Маркеры
markers =
    gui: тесты, требующие GUI (Tkinter)
    slow: медленные тесты (> 1 секунды)
    integration: интеграционные тесты

# Покрытие кода
[coverage:run]
source = core,ui
omit = 
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
